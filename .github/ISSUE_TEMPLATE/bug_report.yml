name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: What did you expect instead?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Cadence version}
  - type: input
    id: os
    attributes: {label: OS}
  - type: textarea
    id: logs
    attributes: {label: Screenshots or logs, description: Remove any API keys before pasting.}
