[package]
name = "cadence"
version = "0.0.0"
description = "A calm, local-first planner for social media content"
edition = "2021"
license = "MIT"

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
